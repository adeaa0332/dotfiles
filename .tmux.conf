# ============================================================
#  tmux configuration
# ============================================================

# ── Navigate between panes (Option + h/j/k/l) ──
# Move focus between existing panes. Vim-style: h=left j=down k=up l=right
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Create a new pane / split (Option + = or -) ──
# Option+=  → new pane BESIDE current (side-by-side)
# Option+-  → new pane BELOW current (stacked)
# New pane opens in the same directory you're currently in.
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# ── Resize the current pane (Option + arrows) ──
# Moves the pane's border in that direction, 5 cells per press.
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# ── Windows (like tabs — each holds its own panes) ──
# Option+t        → new window
# Option+n / p    → next / previous window
# Option+1..5     → jump straight to window 1-5
# Option+x        → close current window
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-x kill-window

# ── Detach & list sessions ──
# Option+d  → detach (leave tmux running in the background; reattach with `tmux a`)
# Option+s  → visual tree of sessions/windows to jump between
# Option+w  → plain text list of sessions
bind -n M-d detach-client
bind -n M-s choose-tree -s
bind -n M-w list-sessions

# ── Quality-of-life extras ──
set -g mouse on           # click panes, drag borders, scroll with the mouse
set -g base-index 1       # number windows starting at 1 instead of 0
setw -g pane-base-index 1 # number panes starting at 1 too

# ── Reload this config without restarting tmux ──
# prefix + r  → re-source the file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
